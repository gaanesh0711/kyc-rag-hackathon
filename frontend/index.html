<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinVisory — KYC & Regulatory Compliance RAG</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
              950: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>

  <!-- React, ReactDOM, Babel, Lucide, Marked -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .markdown-content ul {
      list-style-type: disc;
      padding-left: 1.25rem;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .markdown-content li {
      margin-bottom: 0.25rem;
      color: #cbd5e1;
    }
    .markdown-content h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }
    .markdown-content strong {
      color: #f1f5f9;
      font-weight: 600;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUGGESTIONS = [
      "What SEBI-related regulatory challenges does Zerodha face?",
      "What compliance rules apply to PhonePe UPI and PPI wallets?",
      "What escrow and due-diligence rules apply to Razorpay?",
      "What AML/CFT requirements apply to crypto exchanges like CoinDCX?",
      "What credit bureau reporting guidelines apply to CIBIL & Experian?"
    ];

    const REGULATOR_COLORS = {
      "SEBI": "bg-blue-950/60 text-blue-300 border-blue-700/60",
      "RBI": "bg-emerald-950/60 text-emerald-300 border-emerald-700/60",
      "IRDAI": "bg-amber-950/60 text-amber-300 border-amber-700/60",
      "FIU-IND / Income Tax Department / Government of India": "bg-purple-950/60 text-purple-300 border-purple-700/60",
      "RBI / regulated financial-institution customers": "bg-teal-950/60 text-teal-300 border-teal-700/60",
      "default": "bg-slate-800 text-slate-300 border-slate-700"
    };

    function App() {
      const [question, setQuestion] = useState("");
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);
      const [copied, setCopied] = useState(false);
      const [expandedExcerpts, setExpandedExcerpts] = useState({});

      const handleSearch = async (queryToRun) => {
        const q = queryToRun || question;
        if (!q.trim() || loading) return;

        setLoading(true);
        setError(null);
        setCopied(false);

        try {
          const response = await fetch("http://127.0.0.1:8000/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q.trim() }),
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.detail || `Server responded with status ${response.status}`);
          }

          const data = await response.json();
          setResult(data);
          if (queryToRun) setQuestion(queryToRun);
        } catch (err) {
          console.error(err);
          setError(err.message || "Failed to connect to API server at http://127.0.0.1:8000");
        } finally {
          setLoading(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          handleSearch();
        }
      };

      const handleCopy = () => {
        if (!result?.answer) return;
        navigator.clipboard.writeText(result.answer);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const toggleExcerpt = (idx) => {
        setExpandedExcerpts(prev => ({ ...prev, [idx]: !prev[idx] }));
      };

      return (
        <div className="flex-1 flex flex-col bg-slate-950 text-slate-100">
          
          {/* Header */}
          <header className="border-b border-slate-800/80 bg-slate-900/70 backdrop-blur sticky top-0 z-20 px-6 py-4">
            <div className="max-w-6xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="p-2 bg-slate-800 rounded-lg border border-slate-700 text-indigo-400">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                  </svg>
                </div>
                <div>
                  <h1 className="text-base font-semibold tracking-tight text-white flex items-center gap-2">
                    FinVisory KYC & Regulatory RAG
                    <span className="text-[11px] font-normal px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800/60">
                      Compliance Suite
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400">
                    Grounded Regulatory Assessment & Entity Mapping across 80 Indian Fintechs (SEBI • RBI • IRDAI • FIU-IND)
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2 text-xs text-slate-400 font-mono bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>API: 127.0.0.1:8000</span>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-6 py-8 flex flex-col gap-6">
            
            {/* Search Input Box */}
            <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-xl">
              <div className="relative flex items-center">
                <span className="absolute left-4 text-slate-500">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                </span>
                <input
                  type="text"
                  value={question}
                  onChange={(e) => setQuestion(e.target.value)}
                  onKeyDown={handleKeyDown}
                  placeholder="Ask a regulatory or KYC compliance question (e.g. 'What SEBI challenges does Zerodha face?')..."
                  className="w-full pl-12 pr-28 py-3.5 bg-slate-950 border border-slate-700/80 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
                  disabled={loading}
                />
                <button
                  onClick={() => handleSearch()}
                  disabled={loading || !question.trim()}
                  className="absolute right-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:hover:bg-indigo-600 text-white rounded-md text-xs font-medium flex items-center gap-1.5 transition cursor-pointer"
                >
                  {loading ? (
                    <span>Searching...</span>
                  ) : (
                    <span>Query</span>
                  )}
                </button>
              </div>

              {/* Suggestions */}
              <div className="mt-3.5 flex items-center gap-2 flex-wrap">
                <span className="text-xs text-slate-500 font-medium">Quick Queries:</span>
                {SUGGESTIONS.map((s, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleSearch(s)}
                    className="text-xs bg-slate-800/80 hover:bg-slate-800 hover:border-slate-600 text-slate-300 px-2.5 py-1 rounded-md border border-slate-700/70 transition cursor-pointer text-left"
                  >
                    {s}
                  </button>
                ))}
              </div>
            </div>

            {/* Error Message */}
            {error && (
              <div className="bg-red-950/40 border border-red-800/60 rounded-xl p-4 flex items-start gap-3 text-red-200 text-sm">
                <div className="text-red-400 shrink-0 font-bold">!</div>
                <div>
                  <p className="font-medium text-red-300">Connection or Processing Error</p>
                  <p className="text-xs text-red-400/90 mt-0.5">{error}</p>
                </div>
              </div>
            )}

            {/* Loading Indicator */}
            {loading && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col gap-3 animate-pulse">
                <div className="h-4 bg-slate-800 rounded w-1/3"></div>
                <div className="h-3 bg-slate-800 rounded w-full"></div>
                <div className="h-3 bg-slate-800 rounded w-5/6"></div>
                <div className="h-3 bg-slate-800 rounded w-2/3"></div>
              </div>
            )}

            {/* Results Section */}
            {result && !loading && (
              <div className="flex flex-col gap-6">
                
                {/* Answer Card */}
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm">
                  <div className="flex items-center justify-between pb-3 mb-4 border-b border-slate-800">
                    <div className="flex items-center gap-2 text-xs font-semibold text-slate-300 uppercase tracking-wider">
                      <span className="w-2 h-2 rounded-full bg-indigo-500"></span>
                      Regulatory Assessment & Compliance Summary
                    </div>
                    <button
                      onClick={handleCopy}
                      className="flex items-center gap-1.5 text-xs text-slate-400 hover:text-slate-200 bg-slate-800 px-3 py-1 rounded border border-slate-700 transition cursor-pointer"
                    >
                      {copied ? <span className="text-emerald-400">Copied!</span> : <span>Copy Summary</span>}
                    </button>
                  </div>

                  {/* Render Markdown Answer */}
                  <div 
                    className="markdown-content text-sm text-slate-200 leading-relaxed"
                    dangerouslySetInnerHTML={{ __html: marked.parse(result.answer || '') }}
                  />

                  <div className="mt-5 pt-3 border-t border-slate-800/80 text-[11px] text-slate-500 flex items-center justify-between">
                    <span>Source Distinction: Compliance & regulatory impact analysis — not an allegation of violation.</span>
                    <span className="font-mono">Query: &ldquo;{result.question}&rdquo;</span>
                  </div>
                </div>

                {/* Citations Panel */}
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
                  <div className="flex items-center justify-between pb-3 mb-4 border-b border-slate-800">
                    <div className="flex items-center gap-2 text-xs font-semibold text-slate-300 uppercase tracking-wider">
                      <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                      Verified Citations & Regulatory Metadata ({result.sources?.length || 0})
                    </div>
                    <span className="text-xs text-slate-500 font-mono">ChromaDB Vector Retrieval</span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {result.sources?.map((src, idx) => {
                      const regColor = REGULATOR_COLORS[src.regulator] || REGULATOR_COLORS["default"];
                      const isExpanded = !!expandedExcerpts[idx];

                      return (
                        <div 
                          key={idx}
                          className="bg-slate-950 border border-slate-800/90 rounded-lg p-4 flex flex-col justify-between hover:border-slate-700 transition"
                        >
                          <div>
                            {/* Company Name & Regulator Tag */}
                            <div className="flex items-start justify-between gap-2 mb-2">
                              <h3 className="font-medium text-sm text-white truncate" title={src.company}>
                                {src.company || "Unknown Company"}
                              </h3>
                              <span className={`text-[10px] font-semibold px-2 py-0.5 rounded border uppercase tracking-wider shrink-0 ${regColor}`}>
                                {src.regulator || "N/A"}
                              </span>
                            </div>

                            {/* Sector */}
                            <p className="text-xs text-indigo-300/90 mb-2 font-mono">
                              {src.vertical || "Fintech"}
                            </p>

                            {/* Document File Tag */}
                            <div className="text-[11px] text-slate-400 bg-slate-900 px-2 py-1 rounded border border-slate-800 mb-3 truncate font-mono" title={src.document}>
                              {src.document || "FinVisory Dataset"}
                            </div>
                          </div>

                          {/* Excerpt Toggle */}
                          <div className="border-t border-slate-800/80 pt-2 mt-1">
                            <button
                              onClick={() => toggleExcerpt(idx)}
                              className="w-full flex items-center justify-between text-[11px] text-indigo-400 hover:text-indigo-300 font-medium cursor-pointer"
                            >
                              <span>{isExpanded ? "Hide Excerpt ▲" : "View Source Excerpt ▼"}</span>
                            </button>
                            
                            {isExpanded && (
                              <div className="mt-2 text-[11px] text-slate-300 bg-slate-900 p-2.5 rounded border border-slate-800 font-mono whitespace-pre-wrap leading-relaxed max-h-48 overflow-y-auto">
                                {src.excerpt}
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>
            )}

            {/* Empty State */}
            {!result && !loading && !error && (
              <div className="bg-slate-900/40 border border-slate-800 rounded-xl p-10 text-center flex flex-col items-center justify-center gap-3">
                <div className="p-3.5 bg-slate-800 rounded-full text-indigo-400 border border-slate-700">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                  </svg>
                </div>
                <h2 className="text-base font-medium text-slate-200">
                  Select a Query or Ask a Regulatory Question
                </h2>
                <p className="text-xs text-slate-400 max-w-md leading-relaxed">
                  Query 80 company-level compliance entries across Wealthtech, Insurtech, Payment Aggregators, PPIs, Lending, and Crypto.
                </p>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800/80 bg-slate-900/40 px-6 py-3 text-center text-[11px] text-slate-500">
            FinVisory Compliance RAG • Powered by FastAPI & Gemini • Single-Company Precision Retrieval
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
